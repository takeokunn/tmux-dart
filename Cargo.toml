[package]
name = "tmux-dart"
version = "0.1.8"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "EasyMotion-like cursor jump plugin for tmux"
repository = "https://github.com/takeokunn/tmux-dart"
default-run = "tmux-dart"

[dependencies]
anyhow = "1.0"
tempfile = "3.23"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
